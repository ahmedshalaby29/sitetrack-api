services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sitetrack
      POSTGRES_PASSWORD: sitetrack
      POSTGRES_DB: sitetrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready exits 0 when Postgres is accepting connections
      test: ["CMD-SHELL", "pg_isready -U sitetrack -d sitetrack"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://sitetrack:sitetrack@postgres:5432/sitetrack
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
